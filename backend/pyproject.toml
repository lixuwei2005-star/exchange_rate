[project]
name = "rate-backend"
version = "0.1.0"
description = "rate.005917.xyz backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "openai>=1.30",
    "cryptography>=42.0",
    "PyJWT>=2.8",
    # bcrypt pinned < 4.1: passlib 1.7.4 calls bcrypt.__about__ which was
    # removed in bcrypt >= 4.1, and bcrypt >= 5.0 also strict-rejects passlib's
    # internal probe. Until passlib ships a fix, stay on 4.0.x.
    "passlib>=1.7",
    "bcrypt>=4.0,<4.1",
    "apscheduler>=3.10",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    # Playwright is used only by the maybank scraper to get past Akamai's
    # bot manager (a plain httpx GET from OCI returns 403). The actual
    # Chromium binary is installed by `playwright install` in the Dockerfile.
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "black>=24.0",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]  # black handles line length

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
