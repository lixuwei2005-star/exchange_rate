# Auto-loaded by `docker compose up` / `make dev`. Provides dev-only
# overrides (hot reload, bind-mounted source, host port mapping).
#
# Explicitly excluded by `make prod` (which uses `-f docker-compose.yml -f
# docker-compose.prod.yml` — passing -f suppresses auto-loading of this file).

services:
  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: sh -c "npm install && npm run dev"
