# Production override. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   (or: make prod)
#
# Adds prod-specific ports + prod commands. Because base docker-compose.yml
# has NO `ports:` section, the values below are the only ports docker will
# bind — no merge surprises with dev defaults.

services:
  backend:
    # Bind only the localhost interface — Nginx (BaoTa) proxies inbound.
    # Host port is configurable via BACKEND_HOST_PORT in .env (default 8000),
    # so we can deploy alongside other Docker apps that already use 8000.
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      target: prod
      # NEXT_PUBLIC_BACKEND_URL must be passed as a build arg because Next.js
      # inlines NEXT_PUBLIC_* values into the client JS bundle during
      # `next build`. Runtime env_file injection happens too late.
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    # FRONTEND_HOST_PORT overridable in .env (default 3000).
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    command: ["npm", "run", "start"]
