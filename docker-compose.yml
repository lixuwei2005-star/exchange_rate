# Base compose file — shared config between dev and prod.
# Ports, bind mounts, dev/prod-specific commands live in:
#   docker-compose.override.yml   (auto-loaded for dev: `make dev`)
#   docker-compose.prod.yml       (explicit -f for prod:  `make prod`)
#
# WHY: docker compose MERGES `ports:` lists across files (rather than
# replacing). Putting ports in this base file would force the override file
# to *add* an extra mapping instead of *replacing* — which on a shared
# server collides with existing containers (e.g. studyverify-api on :8000).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rate_backend
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - backend_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rate_frontend
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  frontend_node_modules:
  frontend_next:
